    <!-- Inisialisasi Manifest PWA Dinamis & Service Worker Aman -->
    <script>
        (function initPWA() {
            try {
                // Membuat ikon PNG 192x192 & 512x512 via Canvas agar 100% kompatibel dengan standar install PWA Android/Chrome
                function generateIconDataUrl(size) {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return '';

                    const grad = ctx.createLinearGradient(0, 0, size, size);
                    grad.addColorStop(0, '#facc15');
                    grad.addColorStop(1, '#16a34a');

                    const radius = size * 0.22;
                    ctx.beginPath();
                    ctx.moveTo(radius, 0);
                    ctx.lineTo(size - radius, 0);
                    ctx.quadraticCurveTo(size, 0, size, radius);
                    ctx.lineTo(size, size - radius);
                    ctx.quadraticCurveTo(size, size, size - radius, size);
                    ctx.lineTo(radius, size);
                    ctx.quadraticCurveTo(0, size, 0, size - radius);
                    ctx.lineTo(0, radius);
                    ctx.quadraticCurveTo(0, 0, radius, 0);
                    ctx.closePath();
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = `900 ${Math.round(size * 0.36)}px system-ui, -apple-system, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('CBT', size / 2, size / 2 + size * 0.03);

                    return canvas.toDataURL('image/png');
                }

                const icon192 = generateIconDataUrl(192);
                const icon512 = generateIconDataUrl(512);
                const savedAppName = (function() {
                    try { return localStorage.getItem('appName') || 'CBT Futuristik'; } catch (e) { return 'CBT Futuristik'; }
                })();

                const baseUrl = window.location.href.split('#')[0].split('?')[0];
                const manifestData = {
                    name: savedAppName,
                    short_name: savedAppName.slice(0, 12),
                    description: "Aplikasi Ujian Berbasis Komputer (CBT) Kelas 1-12",
                    start_url: baseUrl,
                    scope: baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1),
                    display: "standalone",
                    orientation: "portrait",
                    background_color: "#f0fdf4",
                    theme_color: "#16a34a",
                    icons: [
                        { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
                        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
                    ]
                };

                const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
                const manifestUrl = URL.createObjectURL(manifestBlob);
                const manifestLink = document.getElementById('pwa-manifest-link');
                if (manifestLink) manifestLink.setAttribute('href', manifestUrl);

                // Pendaftaran Service Worker (jika file sw.js tersedia di root GitHub Pages)
                if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
                    window.addEventListener('load', () => {
                        navigator.serviceWorker.register('./sw.js').catch(() => {
                            // Diamkan jika sw.js belum diunggah agar tidak mengganggu aplikasi
                        });
                    });
                }
            } catch (err) {
                console.warn('PWA init skipped:', err);
            }
        })();
    </script>

        const getCleanLogoUrl = (rawUrl) => {
            if (!rawUrl) return '';
            let urlStr = String(rawUrl).trim();
            const imgRegex = /<img[^>]+src\s*=\s*["']([^"']+)["']/i;
            const match = urlStr.match(imgRegex);
            let finalUrl = match && match[1] ? match[1] : urlStr;

            if (finalUrl.includes('drive.google.com/file/d/')) {
                const idMatch = finalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);

                    return `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
                }

                  clearTimeout(timeoutId);
                  const text = await res.text();
                  let data;
                  try { data = JSON.parse(text); } catch (e) {
                      throw new Error('Respon server tidak valid.');
                  }
                  if (data.status === 'error') throw new Error(data.message || 'Server menolak data.');
                  return data;

                      }
                  }

              const line = lines[i].trim(); if (!line) continue;
              const questionMatch = line.match(/^(?:soal\s*:|(\d+[\.\)]))\s*(.*)/i);
              const optionMatch = line.match(/^([A-D])\s*[\.\)]\s*(.*)/i);
              const keyMatch = line.match(/^kunci\s*:\s*([A-D])/i);

              if (questionMatch) {

              let initialTimeLeft = (config.duration || 60) * 60;

              let initialAnswers = {};
              if (savedAnswersStr) { try { initialAnswers = JSON.parse(savedAnswersStr); } catch(e) { initialAnswers = {}; } }
              saveActiveExamSession({
                  currentUser,
                  activeSubject,
                  subjectJenis,
                  examQuestions: finalQuestions,
                  studentAnswers: initialAnswers,
                  currentQIndex: 0,
                  timeLeft: initialTimeLeft,

          const submitLogic = async () => {
            if (!examQuestions || examQuestions.length === 0) return;
            let correct = 0;
            const detailJawaban = examQuestions.map((q, idx) => {
                const chosen = studentAnswers[q._id] || '-';
                if (chosen === q.answer) correct++;
                return `${idx + 1}:${chosen}`;
            }).join(',');

            const finalScore = Math.round((correct / examQuestions.length) * 100);
            const wrong = examQuestions.length - correct;

            setScore(finalScore);
            setExamResultDetails({
                correct,
                wrong,
                total: examQuestions.length,
                questions: examQuestions,
                answers: studentAnswers
            });

            const subjectJenis = examConfig[activeSubject]?.jenis || 'THB';
            const currentToken = examConfig[activeSubject]?.token || '';

            setSubmitErrorMsg('');

            const currentQueue = getPendingQueue();
            currentQueue.push({ id: submissionId, result: resultPayload, isDemo: !!currentUser?.isDemo, createdAt: Date.now() });
            setPendingQueue(currentQueue);

            // 2. Bersihkan sesi ujian aktif karena siswa sudah mengumpulkan tes
            clearActiveExamSession();
            safeStorage.remove(`exam_progress_${currentUser.nisn}_${activeSubject}_${subjectJenis}`);
            safeStorage.remove(`exam_time_${currentUser.nisn}_${activeSubject}_${subjectJenis}`);

            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});

            let isSaved = false;
            let lastErr = '';

            for (let attempt = 1; attempt <= attempts; attempt++) {
                try {
                    await sendResultToServerDirect(resultPayload, !!currentUser?.isDemo);
                    isSaved = true;
                    break;
                } catch (e) {
                    lastErr = e.message || 'Gangguan koneksi jaringan.';
                    console.error(`Percobaan kirim ke-${attempt} gagal:`, e);
                    if (attempt < attempts) {
                        await new Promise(r => setTimeout(r, attempt * 1500));
                    }
                }
            }

            if (isSaved) {
                const updatedQueue = getPendingQueue().filter(item => item.id !== submissionId);
                setPendingQueue(updatedQueue);
                setSubmitStatus('success');
                setSubmitErrorMsg('');
                fetchSystemData();

                setSubmitStatus('failed');
                setSubmitErrorMsg(lastErr);
                showToast('Pengiriman ke database tertunda karena jaringan. Gunakan tombol Kirim Ulang di layar hasil.', 'warning');
            }

                                      <div key={idx} className={`bg-white p-5 md:p-8 rounded-2xl border-l-8 shadow-md relative overflow-hidden ${isCorrect ? 'border-green-500' : 'border-red-500'}`}>
                                          <div className={`absolute top-0 right-0 px-4 py-1.5 rounded-bl-xl font-black text-xs md:text-sm shadow-sm flex items-center gap-1 ${isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                              {isCorrect ? <><Icon name="check"/> BENAR</> : <><Icon name="xmark"/> SALAH</>}
                                          </div>

                                          <p className="text-gray-900 text-base md:text-lg font-medium mb-6 pr-20 whitespace-pre-wrap break-words leading-relaxed mt-2"><span className="font-black text-gray-500 mr-2">{idx + 1}.</span> {q.text}</p>
                                          
                                          {q.image && (
                                              <div className="mb-6 rounded-xl overflow-hidden border border-gray-200 inline-block p-2 shadow-sm bg-gray-50">
                                                 <img src={getCleanLogoUrl(q.image)} alt="Gambar Soal" className="max-h-48 md:max-h-64 object-contain rounded" onError={(e) => e.target.style.display='none'} />
                                              </div>
                                          )}

                                          <div className="space-y-3">
                                              {['A', 'B', 'C', 'D'].map(opt => {
                                                  const isStudentChoice = studentAns === opt;
                                                  const isActualAnswer = q.answer === opt;
                                                  
                                                  let optClass = "border-gray-200 bg-gray-50 text-gray-700";
                                                  let iconHtml = null;

                                                  if (isActualAnswer) {
                                                      optClass = "border-green-500 bg-green-50 text-green-800 shadow-sm ring-1 ring-green-500 font-bold";
                                                      iconHtml = <Icon name="check-circle" className="text-green-600 text-xl absolute right-4" />;
                                                  } else if (isStudentChoice && !isActualAnswer) {
                                                      optClass = "border-red-500 bg-red-50 text-red-800 shadow-sm ring-1 ring-red-500 font-bold";
                                                      iconHtml = <Icon name="circle-xmark" className="text-red-600 text-xl absolute right-4" />;
                                                  }

                                                  return (
                                                      <div key={opt} className={`relative p-3 md:p-4 rounded-xl border-2 flex items-center gap-4 transition-colors ${optClass}`}>
                                                          <span className={`w-8 h-8 md:w-10 md:h-10 shrink-0 rounded-lg flex items-center justify-center font-black text-sm md:text-base ${isActualAnswer ? 'bg-green-500 text-white' : (isStudentChoice ? 'bg-red-500 text-white' : 'bg-white border border-gray-300 text-gray-500')}`}>
                                                              {opt}
                                                          </span>
                                                          <span className="text-sm md:text-base flex-1 break-words pr-8">{q.options?.[opt]}</span>
                                                          {iconHtml}
                                                      </div>
                                                  )
                                              })}
                                          </div>
                                      </div>
                                  )
                              })}
                          </div>
                      </div>
                  </div>
              )
          }

          // === VIEW LIVE MONITORING (DASHBOARD TV) ===
          if (view === 'live_monitor') {
              const activeSubjectsList = schoolProfile.subjects.filter(sub => examConfig[sub]?.status === 'Aktif');
              const activeText = activeSubjectsList.length > 0 ? activeSubjectsList.join(', ') : 'TIDAK ADA UJIAN AKTIF';

              const liveFilteredResults = examResults.filter(r => {
                  const isUAS = r.mapel.includes('UAS');
                  const mapelBersih = r.mapel.replace(' (UAS)','');
                  return (filterMapel === 'Semua' || mapelBersih === filterMapel) &&
                         matchKelasFilter(r.kelas, filterKelas) &&
                         (filterJenis === 'Semua' || (filterJenis === 'UAS' ? isUAS : !isUAS));
              }).sort((a,b) => b.nilai - a.nilai);

              return (
                  <div className="min-h-screen bg-gray-900 text-white flex flex-col p-4 md:p-8 font-sans overflow-hidden">
                      <GlobalOverlays />
                      <div className="fixed inset-0 z-[-2] bg-gradient-to-br from-gray-900 via-gray-800 to-black"></div>
                      <div className="fixed inset-0 z-[-1] opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] mix-blend-overlay"></div>
                      
                      {/* HEADER LIVE */}
                      <div className="flex flex-col md:flex-row justify-between items-center border-b border-gray-700 pb-4 mb-6 relative z-10 gap-4">
                          <div className="flex items-center gap-4 w-full md:w-auto justify-center md:justify-start">
                              {schoolProfile.logoUrl ? (
                                  <div className="w-16 h-16 bg-white rounded-2xl p-1 shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                                      <img src={getCleanLogoUrl(schoolProfile.logoUrl)} className="w-full h-full object-contain" />
                                  </div>
                              ) : (
                                  <div className="w-16 h-16 bg-gradient-to-br from-yellow-400 to-green-500 rounded-2xl flex items-center justify-center font-black text-3xl shadow-[0_0_15px_rgba(250,204,21,0.4)]">
                                      {schoolProfile.namaSekolah.charAt(0)}
                                  </div>
                              )}
                              <div className="text-center md:text-left">
                                  <h1 className="text-xl md:text-3xl lg:text-4xl font-black tracking-wider text-yellow-400 drop-shadow-md">LIVE MONITORING HASIL UJIAN</h1>
                                  <p className="text-gray-300 font-medium text-sm md:text-lg tracking-widest">{schoolProfile.namaSekolah}</p>
                              </div>
                          </div>
                          
                          <div className="text-center md:text-right w-full md:w-auto">
                              <div className="text-4xl md:text-5xl font-black font-mono tracking-widest text-green-400 drop-shadow-[0_0_15px_rgba(74,222,128,0.4)] bg-gray-900/50 px-6 py-2 rounded-2xl border border-gray-700">
                                  {currentTime.toLocaleTimeString('id-ID', { hour12: false })}
                              </div>
                          </div>
                      </div>

                      {/* INFO BAR */}
                      <div className="flex flex-col xl:flex-row justify-between items-center bg-gray-800/80 rounded-2xl p-4 mb-6 border border-gray-600 shadow-xl relative z-10 gap-4">
                          <div className="flex flex-wrap items-center justify-center gap-3 w-full xl:w-auto">
                              <div className="flex items-center gap-2 bg-red-900/40 border border-red-500/50 px-4 py-2 rounded-xl">
                                  <div className="h-3 w-3 bg-red-500 rounded-full animate-ping shadow-[0_0_10px_rgba(239,68,68,1)]"></div>
                                  <span className="font-bold text-red-200 text-xs md:text-sm uppercase tracking-widest">Live Ujian :</span>
                              </div>
                              <span className="bg-blue-900/50 text-blue-300 px-4 py-2 rounded-xl border border-blue-700/50 font-black text-sm md:text-base tracking-widest uppercase shadow-inner">{activeText}</span>
                          </div>
                          
                          <div className="flex flex-wrap justify-center gap-2 text-xs md:text-sm font-bold w-full xl:w-auto">
                              <span className="bg-gray-700/80 text-gray-300 px-4 py-2 rounded-xl border border-gray-600 shadow-sm"><Icon name="filter" className="mr-1 text-gray-400"/> Mapel: <span className="text-yellow-400">{filterMapel}</span></span>
                              <span className="bg-gray-700/80 text-gray-300 px-4 py-2 rounded-xl border border-gray-600 shadow-sm"><Icon name="users" className="mr-1 text-gray-400"/> Kelas: <span className="text-yellow-400">{filterKelas}</span></span>
                              <span className="bg-gray-700/80 text-gray-300 px-4 py-2 rounded-xl border border-gray-600 shadow-sm"><Icon name="layer-group" className="mr-1 text-gray-400"/> Jenis: <span className="text-yellow-400">{filterJenis}</span></span>
                              <span className="bg-gray-700/80 text-green-400 px-4 py-2 rounded-xl border border-gray-600 shadow-sm flex items-center gap-2"><Icon name="rotate" className="fa-spin"/> Update Otomatis</span>
                          </div>

                          <button onClick={stopLiveMonitor} className="px-6 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition-all shadow-[0_0_15px_rgba(220,38,38,0.5)] flex items-center justify-center gap-2 w-full xl:w-auto hover:scale-105">
                              <Icon name="xmark"/> Tutup Monitor
                          </button>
                      </div>

                      {/* GRID LEADERBOARD (DENGAN REF AUTO-SCROLL) */}
                      <div ref={liveScrollRef} className="flex-1 overflow-y-auto custom-scrollbar relative z-10 px-2 pb-10">
                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
                              {liveFilteredResults.map((r, i) => {
                                  const studentData = savedAdminStudents.find(s => 
                                      String(s.nisn).trim() === String(r.nisn).trim() || 
                                      (s.nama && r.nama && String(s.nama).trim().toLowerCase() === String(r.nama).trim().toLowerCase())
                                  ) || {};
                                  
                                  const photoUrl = studentData.foto ? getCleanLogoUrl(studentData.foto) : '';
                                  const isLulus = r.nilai >= 70;
                                  const scoreColorClass = isLulus ? 'text-green-400 border-green-500/50 bg-gradient-to-r from-green-900/40 to-transparent' : 'text-red-400 border-red-500/50 bg-gradient-to-r from-red-900/40 to-transparent';
                                  const medalColor = i === 0 ? 'from-yellow-300 to-yellow-600 text-yellow-900' : i === 1 ? 'from-gray-300 to-gray-500 text-gray-900' : i === 2 ? 'from-amber-600 to-amber-800 text-amber-100' : 'from-gray-700 to-gray-800 text-gray-300';

                                  return (
                                      <div key={i} className="bg-gray-800/90 border border-gray-600 rounded-2xl p-4 flex flex-col relative overflow-hidden shadow-2xl transition-all hover:scale-[1.02] hover:border-gray-400 group">
                                          <div className={`absolute top-0 right-0 bg-gradient-to-bl ${medalColor} font-black px-4 py-1.5 rounded-bl-xl shadow-lg z-10 border-b border-l border-white/20 text-sm`}>
                                              Peringkat {i + 1}
                                          </div>

                                          <div className="flex gap-4 items-center mb-4 mt-2 relative z-10">
                                              <div className="w-16 h-16 rounded-full border-[3px] border-gray-500 group-hover:border-yellow-400 bg-gray-700 flex items-center justify-center overflow-hidden shrink-0 shadow-lg transition-colors">
                                                  {photoUrl ? <img src={photoUrl} className="w-full h-full object-cover" onError={e => e.target.style.display='none'} /> : <Icon name="user-graduate" className="text-3xl text-gray-400"/>}
                                              </div>
                                              <div className="flex-1 overflow-hidden pr-16">
                                                  <h4 className="text-base md:text-lg font-bold text-white truncate uppercase drop-shadow-sm">{r.nama}</h4>
                                                  <p className="text-xs text-gray-400 font-mono tracking-widest mt-1">NISN: {r.nisn}</p>
                                                  <span className="inline-block mt-2 bg-gray-700 text-gray-200 text-[10px] px-2 py-1 rounded border border-gray-600 font-bold uppercase shadow-inner">KELAS {r.kelas}</span>
                                              </div>
                                          </div>

                                          <div className={`mt-auto border-2 rounded-xl p-3 flex justify-between items-center shadow-inner relative z-10 ${scoreColorClass}`}>
                                              <div className="text-left w-3/5">
                                                  <p className="text-[10px] text-gray-400 uppercase font-bold tracking-widest mb-1">Mata Pelajaran</p>
                                                  <p className="text-xs font-bold text-gray-200 truncate uppercase" title={r.mapel}>{r.mapel}</p>
                                              </div>
                                              <div className="text-3xl md:text-5xl font-black drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)] tracking-tighter w-2/5 text-right">
                                                  {r.nilai}
                                              </div>
                                          </div>
                                      </div>
                                  )
                              })}
                              {liveFilteredResults.length === 0 && (
                                  <div className="col-span-full flex flex-col items-center justify-center py-32 text-gray-500">
                                      <div className="w-24 h-24 bg-gray-800 rounded-full flex items-center justify-center mb-6 shadow-inner border border-gray-700">
                                          <Icon name="satellite-dish" className="text-5xl text-gray-600 animate-pulse"/>
                                      </div>
                                      <p className="text-2xl font-black tracking-widest uppercase">Menunggu Data Ujian...</p>
                                      <p className="text-gray-600 mt-2">Pastikan pengaturan filter Anda sudah tepat.</p>
                                  </div>
                              )}
                          </div>
                      </div>
                  </div>
              )
          }

          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
